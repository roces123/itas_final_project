<div class="min-h-screen bg-[#0f172a] p-6 text-slate-200 font-sans">
  <div class="max-w-3xl mx-auto">
    
    <div class="flex items-center justify-between mb-10">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <h1 class="text-xl font-black uppercase tracking-tight text-white">Student <span class="text-indigo-500">Profile</span></h1>
      </div>
      
      <button routerLink="/user-dashboard" class="group flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-indigo-400 transition-all">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Back to Dashboard
      </button>
    </div>

    <div class="bg-[#1e293b] rounded-[2.5rem] shadow-2xl border border-slate-800 overflow-hidden">
      
      <div class="bg-gradient-to-r from-indigo-600 to-indigo-900 h-40 relative">
        <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
      </div>

      <div class="px-10 pb-12">
        <div class="relative -mt-20 mb-8">
          <div class="w-36 h-36 bg-[#1e293b] rounded-[2rem] shadow-2xl flex items-center justify-center border-[6px] border-[#0f172a]">
            <span class="text-6xl font-black text-indigo-500 uppercase tracking-tighter">
              {{ userData?.fullName?.charAt(0) }}
            </span>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">
          
          <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Full Name</label>
            <p class="text-lg font-bold text-slate-200 tracking-tight leading-none">{{ userData?.fullName }}</p>
            <div class="h-1 w-10 bg-indigo-500/20 rounded-full mt-2"></div>
          </div>

          <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Student ID Number</label>
            <p class="text-lg font-bold text-slate-200 tracking-tight leading-none">{{ userData?.studentId || 'NOT SET' }}</p>
            <div class="h-1 w-10 bg-indigo-500/20 rounded-full mt-2"></div>
          </div>

          <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Official Email</label>
            <p class="text-lg font-bold text-slate-200 tracking-tight leading-none">{{ userData?.email }}</p>
            <div class="h-1 w-10 bg-indigo-500/20 rounded-full mt-2"></div>
          </div>

          <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Course / Program</label>
            <p class="text-lg font-bold text-slate-200 tracking-tight leading-none">{{ userData?.course }}</p>
            <div class="h-1 w-10 bg-indigo-500/20 rounded-full mt-2"></div>
          </div>

        </div>

        <div class="mt-16 pt-8 border-t border-slate-800/50 flex items-center gap-3">
          <div class="p-2 bg-amber-500/10 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <p class="text-[10px] text-slate-500 italic font-medium leading-relaxed">
            Note: If your information is incorrect, please coordinate with the Registrar's Office for data synchronization.
          </p>
        </div>

      </div>
    </div>
  </div>
</div>
