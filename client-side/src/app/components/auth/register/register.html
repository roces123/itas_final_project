<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Create Student Account
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Register to start requesting documents
      </p>
    </div>

    <form class="mt-8 space-y-6" (ngSubmit)="onRegister()">
      <div class="rounded-md shadow-sm space-y-4">

        <div>
          <label for="studentId" class="block text-sm font-medium text-gray-700">Student ID</label>
          <input [(ngModel)]="registerData.studentId" name="studentId" type="text" required 
            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
            placeholder="e.g. 2022-1234">
        </div>

        <div>
          <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name</label>
          <input [(ngModel)]="registerData.fullName" name="fullName" type="text" required 
            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
            placeholder="Juan Dela Cruz">
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
          <input [(ngModel)]="registerData.email" name="email" type="email" required 
            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
            placeholder="student@isufst.edu.ph">
        </div>

        <div>
          <label for="course" class="block text-sm font-medium text-gray-700">Course</label>
          <select [(ngModel)]="registerData.course" name="course" required
            class="block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            <option value="">Select your course</option>
            <option value="BSIT">BS in Information Technology</option>
            <option value="BSCS">BS in Computer Science</option>
            <option value="BSIS">BS in Information Systems</option>
          </select>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input [(ngModel)]="registerData.password" name="password" type="password" required 
            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
            placeholder="Password">
        </div>
      </div>

      <div>
        <button type="submit" 
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150">
          Register Account
        </button>
      </div>
    </form>

    <div class="text-center">
      <p class="text-sm text-gray-600">
        Already have an account? 
        <a routerLink="/login" class="font-medium text-blue-600 hover:text-blue-500 cursor-pointer transition duration-150">
          Sign in here
        </a>
      </p>
    </div>
  </div>
</div>
