<div class="min-h-screen flex items-center justify-center bg-[#0a0f1a] py-12 px-4 sm:px-6 lg:px-8 font-sans">
  <div class="max-w-md w-full space-y-8 bg-[#111827] p-10 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-slate-800/50">
    
    <div class="text-center">
      <h2 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 tracking-tighter">
        ISUFST - DRS
      </h2>
      <p class="mt-3 text-center text-[10px] font-bold text-slate-500 uppercase tracking-[0.3em]">
        Sign in to your account
      </p>
    </div>
    
    <form class="mt-8 space-y-6" (ngSubmit)="onLogin()">
      <div class="space-y-5">
        <div>
          <label class="block text-[10px] font-black text-indigo-400/80 uppercase tracking-widest mb-1.5 ml-2">Official Email</label>
          <input [(ngModel)]="loginData.email" name="email" type="email" required 
            class="w-full bg-[#0a0f1a] p-4 rounded-2xl border border-slate-800 text-slate-100 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-700 sm:text-sm" 
            placeholder="student@isufst.edu.ph">
        </div>

        <div>
          <label class="block text-[10px] font-black text-indigo-400/80 uppercase tracking-widest mb-1.5 ml-2">Password</label>
          <input [(ngModel)]="loginData.password" name="password" type="password" required 
            class="w-full bg-[#0a0f1a] p-4 rounded-2xl border border-slate-800 text-slate-100 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-700 sm:text-sm" 
            placeholder="••••••••">
        </div>
      </div>

      <div class="flex items-center justify-between px-1">
        <div class="flex items-center">
          <input id="remember-me" 
                 name="remember-me" 
                 type="checkbox" 
                 [(ngModel)]="rememberMe"
                 class="h-4 w-4 bg-[#0a0f1a] border-slate-700 rounded text-indigo-600 focus:ring-indigo-500/50 cursor-pointer">
          <label for="remember-me" class="ml-2 block text-xs font-medium text-slate-400 cursor-pointer">
            Remember me
          </label>
        </div>

        <div class="text-xs">
          <a href="#" class="font-bold text-indigo-400 hover:text-indigo-300 transition-colors">
            Forgot password?
          </a>
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="isLoading"
          class="group relative w-full flex justify-center py-4 px-4 bg-gradient-to-r from-indigo-600 to-indigo-700 text-xs font-black uppercase tracking-[0.2em] rounded-2xl text-white hover:from-indigo-500 hover:to-indigo-600 shadow-xl shadow-indigo-900/40 focus:outline-none transition-all active:scale-[0.97] disabled:opacity-50">
          {{ isLoading ? 'SIGNING IN...' : 'SIGN IN' }}
        </button>
      </div>
    </form>

    <div class="text-center pt-2">
      <p class="text-[11px] text-slate-500 font-bold tracking-wide">
        DON'T HAVE AN ACCOUNT YET? 
        <a routerLink="/register" class="text-indigo-400 font-black hover:text-indigo-300 transition-colors ml-1 uppercase">Register here</a>
      </p>
    </div>
  </div>
</div>
